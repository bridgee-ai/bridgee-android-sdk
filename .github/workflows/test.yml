name: Unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_release_script.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      # O repositório ainda não distribui gradle-wrapper.jar.
      - name: Build and stage unsigned Maven artifacts locally
        run: gradle :bridgeesdk:testDebugUnitTest :bridgeesdk:publishToMavenLocal -Dmaven.repo.local="$PWD/build/maven-local"
      - run: python3 tests/test_maven_artifacts.py

      - uses: actions/upload-artifact@v4
        with:
          name: blink-deferred-android-candidate
          path: |
            build/maven-local/ai/bridgee/bridgee-android-sdk/*/*
            bridgeesdk/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 7
